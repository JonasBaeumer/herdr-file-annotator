# Tagged releases: build the four prebuilt binaries scripts/fetch-or-build.sh
# downloads at install time. Asset naming is a contract with that script:
#   herdr-annotator-v{VERSION}-{target}.tar.gz(.sha256)
# Linux targets are musl for static binaries (no C deps in the crate, so no
# musl toolchain is needed — rustup target add suffices).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest version
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$V\"" herdr-plugin.toml || {
            echo "tag $GITHUB_REF_NAME does not match herdr-plugin.toml version" >&2; exit 1; }
          grep -q "^version = \"$V\"" Cargo.toml || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version" >&2; exit 1; }
      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          NAME="herdr-annotator-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist stage
          cp "target/${{ matrix.target }}/release/herdr-annotator" stage/
          tar -C stage -czf "dist/${NAME}.tar.gz" herdr-annotator
          ( cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
