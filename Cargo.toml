[package]
name = "herdr-annotator"
version = "0.4.1"
edition = "2021"
license = "MIT"
description = "Herdr plugin: an agent-summoned, blocking diff-review pane with line annotations."
repository = "https://github.com/JonasBaeumer/herdr-file-annotator"

[[bin]]
name = "herdr-annotator"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.28"
ratatui = "0.29"
# fancy-regex backend: pure Rust, no oniguruma C dependency
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
toml = "0.8"

[profile.release]
strip = true
