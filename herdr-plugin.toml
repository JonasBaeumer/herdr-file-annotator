# herdr-plugin.toml — manifest for the file-annotator plugin.
#
# The pane below is NOT meant to be opened by hand or by a keybinding: the
# annotator MCP server (`herdr-annotator mcp`, registered with your agent)
# opens it via `herdr plugin pane open` when the agent calls the
# `review_changes` tool, injecting the handoff socket path via --env.

id = "jonasbaeumer.file-annotator"
name = "File Annotator"
version = "0.3.1"
min_herdr_version = "0.8.0"
description = "Agent-summoned, blocking diff review: the agent calls an MCP tool, a review pane opens beside it, and the agent waits for your verdict and line annotations."
platforms = ["macos", "linux"]

# Launched by absolute path under the plugin root: the pane's cwd is the repo
# under review, not the plugin root, so a relative path would not resolve.
# scripts/dev-link.sh builds the binary and symlinks it into bin/.
[[panes]]
id = "review"
title = "Review"
placement = "split"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-annotator\" pane"]
